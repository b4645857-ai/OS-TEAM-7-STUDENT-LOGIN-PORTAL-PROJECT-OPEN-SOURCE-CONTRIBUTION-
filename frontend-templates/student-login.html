<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Login | Modern University ERP Portal</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="login-page">

    <div class="login-box">

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
        </a>

        <img src="logo1.png.png" alt="University Logo" class="login-logo">

        <h1>Modern University</h1>

        <h2>Student Login</h2>

        <form action="student-dashboard.html">

            <div class="input-box">

                <i class="fa-solid fa-user"></i>

                <input type="text" placeholder="Student Name" required>

            </div>

            <div class="input-box">

                <i class="fa-solid fa-id-card"></i>

                <input type="text" placeholder="Register Number" required>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

    </div>

</div>

</body>

</html>
